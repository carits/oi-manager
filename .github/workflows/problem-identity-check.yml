name: Problem identity (no database)

on:
  pull_request:
    paths:
      - 'packages/contracts/src/problem-selection.ts'
      - 'packages/shared/src/oj-platforms.ts'
      - 'apps/server/src/modules/problem-selection/**'
      - 'apps/server/src/modules/problem/problem.identity.ts'
      - 'apps/server/tests/problem-selection-local.test.ts'
      - 'apps/web/src/features/problem-selection/**'
      - 'apps/web/src/features/contest/ui/ContestFormModal.tsx'
      - 'apps/web/src/features/assignment/ui/AssignmentWorkspace.tsx'
      - 'apps/web/src/features/training-session/ui/TrainingSetupDialog.tsx'
      - 'apps/web/src/features/training-session/ui/TrainingSessionDesigner.tsx'
      - 'apps/web/src/features/training-session/ui/TrainingSessionWorkspace.tsx'
      - 'apps/web/src/features/problem/ui/ProblemListDetailPage.tsx'
      - '.github/workflows/problem-identity-check.yml'

permissions:
  contents: read

concurrency:
  group: problem-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Intentionally unreachable. This workflow has no database service or secrets.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused?schema=unused
      E2E_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused?schema=unused
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Assert database definitions were not changed
        run: git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- apps/server/prisma
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @oi-manager/contracts build
      - run: pnpm --filter @oi-manager/shared build
      - name: Generate client types only (no database connection)
        run: pnpm --filter server exec prisma generate
      - name: Server type check
        run: pnpm --filter server exec tsc --noEmit
      - name: Web type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Mocked local lookup and contract tests
        run: pnpm --filter server exec vitest run --config vitest.problem-selection.config.ts
      - name: Web unit tests
        run: pnpm --filter web test
      - name: Documentation and architecture gates
        run: pnpm docs:check
      - name: UI state gate
        run: pnpm ui:state-check
      - name: Navigation audit
        run: pnpm routes:audit
