name: UI E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chromium and Firefox smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oi_manager
          POSTGRES_USER: oi
          POSTGRES_PASSWORD: oi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oi -d oi_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://oi:oi_password@127.0.0.1:5432/oi_manager?schema=e2e
      TEST_DATABASE_URL: postgresql://oi:oi_password@127.0.0.1:5432/oi_manager?schema=test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:state-check
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm build
      - name: Prepare clean chat integration schema (no E2E seed)
        run: |
          PGPASSWORD=oi_password psql -h 127.0.0.1 -U oi -d oi_manager -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS test'
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter server exec prisma db push --skip-generate
      - name: Run chat server integration tests
        run: pnpm --filter server exec vitest run tests/chat.test.ts
      - run: pnpm test:chat:race
      - run: pnpm test:ui:smoke
      - run: pnpm test:chat:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results
          # Do not publish runtime passwords or authentication storageState files.
          path: |
            test-results/playwright
            test-results/playwright-report
            test-results/playwright-results.json
          retention-days: 14

  full:
    name: Chromium full and compact desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oi_manager
          POSTGRES_USER: oi
          POSTGRES_PASSWORD: oi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oi -d oi_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://oi:oi_password@127.0.0.1:5432/oi_manager?schema=e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:state-check
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm build
      - run: pnpm test:ui:prepare
      - run: pnpm exec playwright test --project=chromium-desktop --project=chromium-compact --project=firefox-chat
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-full-results
          path: |
            test-results/playwright
            test-results/playwright-report
            test-results/playwright-results.json
          retention-days: 14

  live:
    name: Manual live OJ and Judge probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_LIVE_BASE_URL: ${{ secrets.E2E_LIVE_BASE_URL }}
      E2E_LIVE_USERNAME: ${{ secrets.E2E_LIVE_USERNAME }}
      E2E_LIVE_PASSWORD: ${{ secrets.E2E_LIVE_PASSWORD }}
      E2E_LIVE_ROLE: ${{ secrets.E2E_LIVE_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:live
