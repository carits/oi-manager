name: UI E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chromium and Firefox smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oi_manager
          POSTGRES_USER: oi
          POSTGRES_PASSWORD: oi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oi -d oi_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://oi:oi_password@127.0.0.1:5432/oi_manager?schema=e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm build
      - run: pnpm test:ui:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results
          path: test-results
          retention-days: 14

  full:
    name: Chromium full and compact desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oi_manager
          POSTGRES_USER: oi
          POSTGRES_PASSWORD: oi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oi -d oi_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://oi:oi_password@127.0.0.1:5432/oi_manager?schema=e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm build
      - run: pnpm test:ui:prepare
      - run: pnpm exec playwright test --project=chromium-desktop --project=chromium-compact
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-full-results
          path: test-results
          retention-days: 14

  live:
    name: Manual live OJ and Judge probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_LIVE_BASE_URL: ${{ secrets.E2E_LIVE_BASE_URL }}
      E2E_LIVE_USERNAME: ${{ secrets.E2E_LIVE_USERNAME }}
      E2E_LIVE_PASSWORD: ${{ secrets.E2E_LIVE_PASSWORD }}
      E2E_LIVE_ROLE: ${{ secrets.E2E_LIVE_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:live
