name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm docs:check
      - run: pnpm ui:state-check
      - name: Architecture progress summary
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm architecture:progress:check
      - run: pnpm architecture:progress:verify

