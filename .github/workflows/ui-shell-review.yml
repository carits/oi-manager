name: UI shell branch review

on:
  push:
    branches: [codex/ui-shell-workspace-unification]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'e2e/**'
      - 'scripts/**'
      - '.github/workflows/ui-shell-review.yml'

permissions:
  contents: read

concurrency:
  group: ui-shell-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Review source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar --output=review-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ui-shell-source-${{ github.sha }}
          path: review-source.tar
          retention-days: 1

  checks:
    name: Web unit, type and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oi-manager/contracts build && pnpm --filter @oi-manager/shared build
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web test
      - run: pnpm ui:state-check
      - run: pnpm architecture:check
      - run: pnpm routes:audit
      - run: pnpm docs:check
      - run: pnpm --filter web build
