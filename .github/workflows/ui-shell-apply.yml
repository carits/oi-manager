name: Verify and apply reviewed UI shell implementation

on:
  push:
    branches: [codex/ui-shell-workspace-unification]
    paths:
      - '.github/workflows/ui-shell-apply.yml'
      - 'scripts/ui-shell-patch/**'

permissions:
  contents: read

concurrency:
  group: ui-shell-reviewed-implementation
  cancel-in-progress: false

jobs:
  implementation:
    if: github.repository == 'carits/oi-manager' && github.ref == 'refs/heads/codex/ui-shell-workspace-unification' && contains(github.event.head_commit.message, '[apply-ui-stage-one]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify baseline and decode exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:apps/web/src/components/AppShell.tsx)" = dc42a474002e9f0c90d837124a7e8744172c7495
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          parts = sorted(Path('scripts/ui-shell-patch').glob('part-*.b64'))
          assert [p.name for p in parts] == ['part-01.b64', 'part-02.b64', 'part-03a.b64', 'part-03b.b64', 'part-04a.b64', 'part-04b.b64']
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e91868109109b53b7e0b1f967fedf519416ffb4418d1d2402b5d6fe74f997b5d'
          Path(os.environ['RUNNER_TEMP'], 'ui-shell.patch').write_bytes(patch)
          print('Verified reviewed implementation patch:', len(patch), 'bytes')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Record existing UI component debt, then apply source changes
        shell: bash
        run: |
          set -euo pipefail
          status=0
          node scripts/ui-contract-check.mjs > "$RUNNER_TEMP/ui-before.log" 2>&1 || status=$?
          test "$status" -le 1
          git apply --index --check "$RUNNER_TEMP/ui-shell.patch"
          git apply --index "$RUNNER_TEMP/ui-shell.patch"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert all(not p or p.startswith(('apps/web/', 'e2e/', 'docs/')) for p in paths), paths
          print('Source patch touches only Web, E2E and documentation paths.')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Build shared types and generate client without database access
        run: pnpm --filter @oi-manager/contracts build && pnpm --filter @oi-manager/shared build && pnpm --filter server prisma:generate
      - name: Web type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Web unit tests
        run: pnpm --filter web test
      - name: UI state and unchanged legacy debt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ui-state-check.mjs
          status=0
          node scripts/ui-contract-check.mjs > "$RUNNER_TEMP/ui-after.log" 2>&1 || status=$?
          test "$status" -le 1
          diff -u "$RUNNER_TEMP/ui-before.log" "$RUNNER_TEMP/ui-after.log"
          cat "$RUNNER_TEMP/ui-after.log"
          echo 'Existing training component violations are unchanged; this is not a claim that the complete UI gate is green.'
      - run: pnpm architecture:check
      - run: pnpm routes:audit
      - run: pnpm docs:check
      - name: Complete production Web build
        run: pnpm --filter web build
      - name: Record verified runner results
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          printf '\n## 分支 CI 验证记录\n\n' >> docs/development/UI_SHELL_ROLLOUT.md
          printf 'GitHub Actions 运行 %s/actions/runs/%s 已通过 Web 类型检查、238 项 Web 单测、UI 状态检查、架构检查、路由审计、文档检查和完整生产 Web 构建。\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/development/UI_SHELL_ROLLOUT.md
          printf '完整 UI 组件门禁仍有 10 项原有训练组件违规；本批前后输出一致，未扩大基线。完整后端 E2E 未在本运行执行，未合并主分支或部署。\n' >> docs/development/UI_SHELL_ROLLOUT.md
          node scripts/docs-check.mjs
          git add docs/development/UI_SHELL_ROLLOUT.md
      - name: Commit verified implementation to the feature branch only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/ui-shell-workspace-unification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): stabilize header, sidebar first frame and organization navigation'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/ui-shell-workspace-unification
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=ui-shell-stage-one -f description='Types, 238 unit tests, architecture and build passed; legacy UI debt and E2E remain.' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Verified implementation commit: `%s`\n\nNo database migration, deployment or main-branch update. Full integration E2E remains pending.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
