name: UI shell offline review toolchain
on:
  push:
    branches: [codex/ui-shell-workspace-unification]
permissions:
  contents: read
jobs:
  dependencies:
    if: contains(github.event.head_commit.message, '[toolchain]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oi-manager/contracts build && pnpm --filter @oi-manager/shared build && pnpm --filter server prisma:generate
      - name: Package installed dependencies without credentials or runtime data
        run: |
          mkdir -p review-toolchain
          cp -a "$HOME/setup-pnpm/node_modules/pnpm" review-toolchain/pnpm
          tar -czf review-dependencies.tar.gz node_modules apps/web/node_modules apps/server/node_modules apps/judge/node_modules packages/contracts/node_modules packages/shared/node_modules packages/contracts/dist packages/shared/dist review-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: ui-shell-review-dependencies
          path: review-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
