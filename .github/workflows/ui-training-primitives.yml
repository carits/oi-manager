name: Complete scoped training UI primitive migration
on:
  push:
    branches: [codex/ui-shell-workspace-unification]
    paths:
      - 'scripts/migrate-training-ui-primitives.mjs'
      - '.github/workflows/ui-training-primitives.yml'
permissions:
  contents: read
concurrency:
  group: ui-training-primitives
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'carits/oi-manager' && github.ref == 'refs/heads/codex/ui-shell-workspace-unification' && contains(github.event.head_commit.message, '[ui-primitives]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply only the reviewed primitive replacements
        run: |
          node scripts/migrate-training-ui-primitives.mjs --write
          python3 - <<'PY'
          import subprocess
          allowed = {
            'apps/web/src/features/training-session/ui/TrainingDesignAuxiliary.tsx',
            'apps/web/src/features/training-session/ui/TrainingSessionDesigner.tsx',
            'apps/web/src/features/training-session/ui/TrainingSessionWorkspace.tsx',
            'apps/web/src/features/training-session/ui/TrainingEngine.module.css',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed <= allowed, changed
          PY
          git diff --check
          git diff --stat
      - run: pnpm --filter @oi-manager/contracts build && pnpm --filter @oi-manager/shared build && pnpm --filter server prisma:generate
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web test
      - run: pnpm ui:state-check
      - name: Commit verified UI-only source replacements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          test "$GITHUB_REF" = refs/heads/codex/ui-shell-workspace-unification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/training-session/ui/TrainingDesignAuxiliary.tsx apps/web/src/features/training-session/ui/TrainingSessionDesigner.tsx apps/web/src/features/training-session/ui/TrainingSessionWorkspace.tsx apps/web/src/features/training-session/ui/TrainingEngine.module.css
          git commit -m 'refactor(ui): finish training primitive and visual token migration'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/ui-shell-workspace-unification
          printf 'Committed UI-only migration: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm architecture:check
      - run: pnpm routes:audit
      - run: pnpm docs:check
      - run: pnpm --filter web build
