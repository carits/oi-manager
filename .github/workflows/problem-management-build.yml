name: Problem management compile only
on:
  push:
    branches: [codex/problem-management-completion]
permissions:
  contents: write
concurrency:
  group: problem-management-implementation
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      E2E_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source edits to this branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/problem-management-completion
          if test -f .github/problem-management-apply.py; then
            python3 .github/problem-management-apply.py
            rm .github/problem-management-apply.py
            if git diff --name-only | grep -E '(^|/)(prisma|migrations|tests|e2e)/|\.(test|spec)\.'; then
              echo 'Refusing changes to database definitions, migrations or tests.'
              exit 1
            fi
            git diff --stat
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps packages scripts docs .github/problem-management-apply.py
            git commit -m 'refactor(problem): apply explicit identity and editor changes'
            git push origin HEAD:refs/heads/codex/problem-management-completion
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @oi-manager/contracts build && pnpm --filter @oi-manager/shared build
      - name: Generate TypeScript client without a database connection
        run: pnpm --filter server exec prisma generate
      - name: Server static type check
        if: success()
        run: pnpm --filter server exec tsc --noEmit
      - name: Web static type check
        if: success() || failure()
        run: pnpm --filter web exec tsc --noEmit
      - name: Source inventory for remaining callers
        if: always()
        run: |
          git rev-parse HEAD
          git grep -n 'findUsableProblemByExternalId\|createProblem(\|updateProblem(' -- apps/web/src apps/server/src || true
          find apps/server/src/modules/assignment apps/server/src/modules/training -maxdepth 3 -type f 2>/dev/null | head -100 || true
          git diff --exit-code c9de6949770e24166a28062f7a422270634cc0b3 HEAD -- apps/server/prisma
