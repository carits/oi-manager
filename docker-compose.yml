version: '2.4'
services:
  db:
    image: postgres:16-alpine
    container_name: oi-postgres
    environment:
      POSTGRES_DB: oi_manager
      POSTGRES_USER: oi
      POSTGRES_PASSWORD: oi_password
    ports:
      # The application and maintenance tools run on this host. Do not expose
      # the database directly to the public network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oi -d oi_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    restart: unless-stopped

  # go-judge sandbox with C/C++ and Python 3; compile and execute both stay isolated.
  judge:
    build:
      context: .
      dockerfile: docker/go-judge.Dockerfile
    image: oi-manager/go-judge:v1.12.1-gcc-python3
    container_name: oi-judge
    ports:
      # go-judge is a privileged execution service and must only be reachable
      # by the local judge consumer.
      - "127.0.0.1:5050:5050"
    volumes:
      # Mount cgroup filesystem for memory limit and peak memory metrics.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      # Go's temporary-directory API creates /tmp/go-judge<random>, so the
      # bounded writable mount must cover /tmp rather than one fixed child.
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 512m
    # cgroup access is required by go-judge.
    privileged: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    memswap_limit: 2g
    cpu_period: 100000
    cpu_quota: 150000
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    restart: unless-stopped

volumes:
  pgdata:
