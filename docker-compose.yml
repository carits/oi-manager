version: '3.3'
services:
  db:
    image: postgres:16-alpine
    container_name: oi-postgres
    environment:
      POSTGRES_DB: oi_manager
      POSTGRES_USER: oi
      POSTGRES_PASSWORD: oi_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oi -d oi_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  # go-judge sandbox with C/C++ compilers; compile and execute both stay isolated.
  judge:
    build:
      context: .
      dockerfile: docker/go-judge.Dockerfile
    image: oi-manager/go-judge:v1.12.1-gcc
    container_name: oi-judge
    ports:
      - "5050:5050"
    volumes:
      - judge-data:/tmp/go-judge
      # Mount cgroup filesystem for memory limit and peak memory metrics.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    shm_size: 512m
    # cgroup access is required by go-judge.
    privileged: true
    restart: unless-stopped

volumes:
  pgdata:
  judge-data:
