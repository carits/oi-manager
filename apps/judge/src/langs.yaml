# 语言编译/执行配置
# 目前仅支持 C/C++

c:
  code_file: main.c
  execute_file: main
  compile: gcc main.c -o main -O2 -Wall
  execute: ./main
  compile_time_limit: 60000
  compile_memory_limit: 524288

c11:
  code_file: main.c
  execute_file: main
  compile: gcc main.c -o main -O2 -std=c11 -Wall
  execute: ./main
  compile_time_limit: 60000
  compile_memory_limit: 524288

cpp:
  code_file: main.cpp
  execute_file: main
  compile: g++ main.cpp -o main -O2 -std=c++17 -Wall
  execute: ./main
  compile_time_limit: 60000
  compile_memory_limit: 524288

